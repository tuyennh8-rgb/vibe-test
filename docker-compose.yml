services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong file .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Không mở cổng ra ngoài: chỉ dịch vụ app trong mạng Compose kết nối được tới db.

  app:
    build: .
    image: dap-chuot:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "3000"
      DB_HOST: db
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
