<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị — Đập chuột</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- A1 · Đăng nhập -->
<main id="view-login" class="center">
  <form id="login-form" class="panel login" novalidate>
    <h1>Đăng nhập <span>quản trị</span></h1>
    <p id="login-notice" class="notice" role="status" hidden></p>
    <div class="field">
      <label for="login-user">Tên đăng nhập</label>
      <input id="login-user" class="input" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-pass">Mật khẩu</label>
      <input id="login-pass" class="input" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button id="login-submit" class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
</main>

<!-- A2 · Danh sách người chơi -->
<div id="view-list" class="page" hidden>
  <header class="topbar">
    <h1 id="list-title">Người chơi (0)</h1>
    <div class="tools">
      <div class="search">
        <label for="search" class="sr-only">Tìm theo tên, email, số điện thoại</label>
        <input id="search" class="input" type="search" maxlength="100" placeholder="Tìm theo tên, email, số điện thoại…" autocomplete="off">
        <button id="search-clear" class="btn btn-ghost btn-sm" type="button" hidden>Xoá</button>
      </div>
      <button id="btn-export" class="btn btn-outline btn-sm" type="button">Xuất CSV</button>
      <button id="btn-logout" class="btn btn-outline btn-sm" type="button">Đăng xuất</button>
    </div>
  </header>

  <p id="list-error" class="error" role="alert" hidden></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Họ và tên</th><th>Email</th><th>Số điện thoại</th><th>Ngày đăng ký</th><th><span class="sr-only">Thao tác</span></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="empty" hidden></p>

  <nav class="pager" aria-label="Phân trang">
    <button id="prev" class="btn btn-outline btn-sm" type="button">← Trước</button>
    <span id="page-info">Trang 1 / 1</span>
    <button id="next" class="btn btn-outline btn-sm" type="button">Sau →</button>
  </nav>
</div>

<!-- A3 · Hộp xác nhận xoá -->
<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="confirm">
    <h2 id="confirm-title">Xoá người chơi?</h2>
    <p class="note">Thao tác này không thể hoàn tác.</p>
    <p id="confirm-error" class="error" role="alert" hidden></p>
    <div class="actions">
      <button id="confirm-cancel" class="btn btn-outline" type="submit" value="cancel" autofocus>Huỷ</button>
      <button id="confirm-ok" class="btn btn-primary" type="button">Xoá</button>
    </div>
  </form>
</dialog>

<script src="admin.js"></script>
</body>
</html>
